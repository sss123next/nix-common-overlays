<script>
/*
 * Device-страница в 7.3.2 открывает сокет принтера сама (`new WebSocket` прямо
 * в бандле; ws_proxy из 7.3.0 ей больше не нужен), но обе болячки остались:
 *
 *  1. Кадр {method:"get",params:{reqHistory:1}} отправляется ровно один раз —
 *     в onMounted и под проверкой dataCenter.getPrinter(addr) && .socket. Сокет
 *     назначает ответ на get_machine_list/probe_lan_device, то есть уже после
 *     монтирования: на первом заходе проверка не проходит, запрос не уходит,
 *     повтора нет — история пуста до повторного входа на страницу.
 *  2. Удаление записи: страница шлёт {params:{deleteHistory:[...]}} и только
 *     чистит выбор, список обновится лишь когда принтер сам пришлёт historyList.
 *
 * Перехват WebSocket.prototype.send + обёртка конструктора: наш инлайн-скрипт
 * вставляется в конец <body> и выполняется раньше defer-бандла страницы, так что
 * успевает заменить WebSocket до её кода. Формат кадра не выдумываем — после
 * удаления переуотправляем тот же reqHistory, что страница уже отправляла этим
 * сокетом (fallback нужен только для первого захода).
 *
 * Post-open запрос уходит только на ws:// с LAN-адресом (принтер), чтобы не
 * слать мусор облачным wss://-сокетам этой же страницы, и только если страница
 * за это время сама ничего не запросила.
 */
(function () {
  if (window.__cpHistoryFix || typeof WebSocket === "undefined") return;
  window.__cpHistoryFix = 1;

  var Orig = WebSocket;
  var origSend = Orig.prototype.send;
  var seen = [];   // сокеты, на которых страница сама просила историю
  var lastFrame = null;

  function is_lan_socket(url) {
    var m = /^wss?:\/\/([^/:]+)/i.exec(String(url || ""));
    if (!m) return false;
    var h = m[1];
    if (/^\d+\.\d+\.\d+\.\d+$/.test(h))
      return /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(h);
    return false;   // облачные сокет-хосты — имена, их не трогаем
  }

  function history_frame() {
    return lastFrame || JSON.stringify({ method: "get", params: { reqHistory: 1 } });
  }

  function ask(sock) {
    try {
      if (sock && sock.readyState === 1) origSend.call(sock, history_frame());
    } catch (e) {}
  }

  Orig.prototype.send = function (data) {
    try {
      var text = String(data);
      if (text.indexOf('"reqHistory"') !== -1) {
        if (seen.indexOf(this) === -1) seen.push(this);
        lastFrame = text;
      } else if (text.indexOf('"deleteHistory"') !== -1) {
        var sock = this;
        [1200, 3000, 6000].forEach(function (delay) {
          setTimeout(function () { ask(sock); }, delay);
        });
      }
    } catch (e) {}
    return origSend.apply(this, arguments);
  };

  function Wrapped(url, protocols) {
    var sock = protocols === undefined ? new Orig(url) : new Orig(url, protocols);
    try {
      if (is_lan_socket(url)) {
        sock.addEventListener("open", function () {
          setTimeout(function () {
            if (seen.indexOf(sock) === -1) ask(sock);
          }, 2500);
        });
      }
    } catch (e) {}
    return sock;
  }
  Wrapped.prototype = Orig.prototype;
  ["CONNECTING", "OPEN", "CLOSING", "CLOSED"].forEach(function (k) {
    Wrapped[k] = Orig[k];
  });
  window.WebSocket = Wrapped;
})();
</script>
