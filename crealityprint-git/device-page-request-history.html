<script>
/*
 * Обход гонки на device-странице: компонент истории посылает принтеру
 *   {method:"get",params:{reqHistory:1}}
 * ровно один раз — в onMounted, под проверкой
 *   dataCenter.getPrinter(addr) != null && .socket
 * Но dataCenter наполняется из ответа C++ на get_machine_list, который приходит
 * уже после монтирования. На первом заходе проверка не проходит, запрос не
 * уходит и повтора нет — история пуста до повторного входа на страницу.
 *
 * Здесь тот же кадр отправляется через ws-proxy сразу после того, как сессия
 * открылась (ProxyWebSocket шлёт {type:"open"} со своим id/socketToken).
 *
 * Второй сценарий — удаление записи: страница шлёт {params:{deleteHistory:[...]}}
 * и очищает выбор, а обновлённый список появляется только когда принтер сам
 * пришлёт historyList. Перезапрашиваем историю через 1.2/3/6 с, чтобы список
 * обновлялся сразу после удаления.
 */
(function () {
  var tries = 0;
  var lastSession = null;

  function install() {
    var bridge = window.wx;
    if (!bridge || !bridge.postMessage) {
      if (++tries < 50) setTimeout(install, 200);
      return;
    }
    if (bridge.__cpReqHistory) return;
    bridge.__cpReqHistory = true;

    var post = bridge.postMessage;

    function requestHistory(session) {
      if (!session) return;
      try {
        // pageToken обязателен и должен лежать внутри payload — иначе
        // parse_proxy_command() в C++ отбросит команду.
        post.call(bridge, JSON.stringify({
          command: "ws_proxy",
          payload: {
            type: "send",
            pageToken: session.pageToken,
            id: session.id,
            socketToken: session.socketToken,
            data: JSON.stringify({ method: "get", params: { reqHistory: 1 } })
          }
        }));
      } catch (e) {}
    }

    bridge.postMessage = function (payload) {
      try {
        var text = String(payload);
        if (text.indexOf('"command":"ws_proxy"') !== -1) {
          var msg = JSON.parse(text);
          var p = msg && msg.payload;
          if (p && p.type === "open" && p.socketToken && p.pageToken) {
            lastSession = {
              id: p.id,
              socketToken: p.socketToken,
              pageToken: p.pageToken
            };
            setTimeout(function () { requestHistory(lastSession); }, 300);
            setTimeout(function () { requestHistory(lastSession); }, 2000);
          } else if (p && p.type === "send" && typeof p.data === "string" &&
                     p.data.indexOf('"deleteHistory"') !== -1) {
            var session = {
              id: p.id,
              socketToken: p.socketToken,
              pageToken: p.pageToken
            };
            lastSession = session;
            setTimeout(function () { requestHistory(session); }, 1200);
            setTimeout(function () { requestHistory(session); }, 3000);
            setTimeout(function () { requestHistory(session); }, 6000);
          }
        }
      } catch (e) {}
      return post.apply(bridge, arguments);
    };
  }

  install();
})();
</script>
